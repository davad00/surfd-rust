[package]
name = "bevy-surf"
version = "0.1.10"
edition = "2024"
default-run = "bevy-surf"

[features]
default = ["client", "client-audio"]
client = [
    "dep:bevy",
    "bevy/default_app",
    "bevy/bevy_winit",
    "bevy/x11",
    "bevy/multi_threaded",
    "bevy/default_font",
    "bevy/bevy_pbr",
    "bevy/ui_bevy_render",
    "bevy/ui_picking",
    "bevy/system_clipboard",
    "dep:ureq",
    "dep:bzip2",
]
records-service = ["dep:argon2", "dep:rusqlite", "dep:tiny_http", "dep:ureq", "dep:bzip2"]
client-audio = ["client", "bevy/bevy_audio"]

[dependencies]
bevy = { version = "0.20.1", optional = true, default-features = false, features = ["std"] }
bevy_math = { version = "0.20.1", default-features = false, features = ["std"] }
lzma-rs = "0.3"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
bzip2 = { version = "0.6.1", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
ureq = { version = "3", optional = true }
vformats = { version = "0.1.0", default-features = false, features = ["bsp", "vmt", "vpk", "vtf"] }
argon2 = { version = "0.5", optional = true }
getrandom = "0.4"
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
tiny_http = { version = "0.12", optional = true }
ctrlc = { version = "3.5.2", features = ["termination"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["poll"] }

[target.'cfg(all(target_os = "windows", target_arch = "x86_64", target_env = "msvc"))'.dependencies]
bevy = { version = "0.20.1", optional = true, default-features = false, features = ["statically-linked-dxc"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring"] }

[[bin]]
name = "bevy-surf"
path = "src/main.rs"
required-features = ["client"]

[[bin]]
name = "surf-records"
path = "src/bin/surf-records.rs"
required-features = ["records-service"]

[profile.dev]
debug = 0

[profile.dev.package.bevy-surf]
opt-level = 2

[profile.dev.package.zlib-rs]
opt-level = 3

[profile.dev.package.serde_json]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
