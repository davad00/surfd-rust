# Include in the Nginx http context. Set the domain and PEM paths for your host.
limit_conn_zone $binary_remote_addr zone=surfd_records_client:1m;
limit_conn_zone $server_name zone=surfd_records_total:1m;
log_format surfd_records '$remote_addr "$request_method $uri" $status $request_time $upstream_response_time';

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name records.example.com;
    ssl_certificate /etc/surfd/records-tls/fullchain.pem;
    ssl_certificate_key /etc/surfd/records-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # OAuth callback query parameters can contain a short-lived sign-in code.
    access_log /var/log/nginx/surfd-records-access.log surfd_records;
    client_header_timeout 10s;
    client_body_timeout 20s;
    client_max_body_size 16m;
    limit_conn surfd_records_client 32;
    limit_conn surfd_records_total 64;
    limit_conn_status 503;

    location /v1/ {
        proxy_pass http://127.0.0.1:27166;
        proxy_http_version 1.1;
        proxy_set_header Connection close;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_max_temp_file_size 32m;
        proxy_connect_timeout 3s;
        proxy_read_timeout 610s;
        proxy_intercept_errors off;
    }

    location / {
        return 404;
    }
}
